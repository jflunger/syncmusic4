<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Manager — SyncMusic4</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0e0f13;
      --panel: #181a21;
      --panel-2: #1f222b;
      --border: #2a2e3a;
      --text: #e7e9ee;
      --muted: #8b90a0;
      --spotify: #1DB954;
      --soundcloud: #ff5500;
      --youtube: #ff3b30;
      --ok: #2ecc71;
      --fail: #ff5d5d;
      --accent: #6c8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    a { color: var(--accent); text-decoration: none; }

    header.topbar {
      display: flex; align-items: center; gap: 16px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      position: sticky; top: 0; z-index: 10;
    }
    header.topbar h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header.topbar .spacer { flex: 1; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 600;
      background: var(--panel-2); border: 1px solid var(--border);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .dot.off { background: var(--fail); }

    .wrap { padding: 20px; max-width: 1280px; margin: 0 auto; }

    .stats {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
      margin-bottom: 20px;
    }
    .stat {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px;
    }
    .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .stat .value { font-size: 28px; font-weight: 700; margin-top: 4px; }

    .grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
      align-items: start;
    }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

    .events-panel { margin-top: 16px; }

    .col {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
    }
    .col > .col-head {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px; border-bottom: 1px solid var(--border);
      font-weight: 600;
    }
    .col-head .pill {
      margin-left: auto; font-size: 12px; color: var(--muted);
      background: var(--panel-2); border: 1px solid var(--border);
      padding: 2px 8px; border-radius: 999px;
    }
    .platform-dot { width: 10px; height: 10px; border-radius: 50%; }
    .platform-spotify .platform-dot { background: var(--spotify); }
    .platform-soundcloud .platform-dot { background: var(--soundcloud); }
    .platform-youtube .platform-dot { background: var(--youtube); }

    .col-body { padding: 12px 14px; }

    .now {
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; margin-bottom: 12px;
    }
    .now.idle { color: var(--muted); text-align: center; padding: 18px 12px; }
    .now .title { font-weight: 600; }
    .now .artist { color: var(--muted); font-size: 13px; }
    .src-url {
      display: block; margin-top: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px; color: var(--accent); text-decoration: none;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .src-url::before { content: "🔗 "; }
    a.src-url:hover { text-decoration: underline; }

    .progress {
      margin-top: 10px; height: 6px; border-radius: 999px;
      background: var(--border); overflow: hidden;
    }
    .progress > i {
      display: block; height: 100%; width: 40%; border-radius: 999px;
      background: var(--accent);
      animation: indet 1.1s ease-in-out infinite;
    }
    @keyframes indet {
      0% { margin-left: -40%; } 100% { margin-left: 100%; }
    }

    /* Backoff state */
    .backoff {
      display: flex; gap: 8px; margin-bottom: 12px;
    }
    .backoff .chip {
      flex: 1; display: flex; flex-direction: column; gap: 2px;
      background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px;
    }
    .backoff .chip .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    .backoff .chip .v { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .backoff.warn .chip.fails { border-color: #5a3a00; background: rgba(255,170,0,.10); }
    .backoff.warn .chip.fails .v { color: #ffaa00; }

    .queue-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin: 4px 0 8px; }
    ul.queue { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    ul.queue li {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 8px;
      background: var(--panel-2); border: 1px solid var(--border);
    }
    ul.queue li .num { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 18px; }
    ul.queue li .t { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    ul.queue li .t .line { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    ul.queue li .t b { font-weight: 600; }
    ul.queue li .t .line span { color: var(--muted); }
    .empty { color: var(--muted); font-size: 13px; padding: 4px 2px; }

    /* Event feed */
    .feed { max-height: 70vh; overflow-y: auto; }
    .ev {
      display: grid; grid-template-columns: auto 1fr auto; gap: 8px;
      align-items: baseline;
      padding: 8px 10px; border-radius: 8px; margin-bottom: 6px;
      background: var(--panel-2); border: 1px solid var(--border);
    }
    .ev .tag {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
    }
    .ev .tag.queued { background: #2a2e3a; color: var(--muted); }
    .ev .tag.started { background: rgba(108,140,255,.15); color: var(--accent); }
    .ev .tag.completed { background: rgba(46,204,113,.15); color: var(--ok); }
    .ev .tag.failed { background: rgba(255,93,93,.15); color: var(--fail); }
    .ev .tag.sync { background: rgba(255,170,0,.15); color: #ffaa00; }
    .ev .desc { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .ev .desc .line { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ev .desc .src { color: var(--muted); font-size: 12px; }
    .ev .reason {
      margin-left: 8px; font-size: 11px; font-weight: 700;
      padding: 1px 6px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em;
    }
    .ev .reason-rate_limit { background: rgba(255,170,0,.15); color: #ffaa00; }
    .ev .reason-unavailable { background: rgba(108,140,255,.15); color: var(--accent); }
    .ev .reason-other { background: #2a2e3a; color: var(--muted); }
    .ev .path {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px; color: #9fe6b4;
      background: #10160f; border: 1px solid #243024; border-radius: 6px;
      padding: 3px 7px; word-break: break-all;
    }
    .ev .path::before { content: "📁 "; }
    .ev .url {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px; color: var(--accent); text-decoration: none;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ev .url::before { content: "🔗 "; }
    a.ev .url:hover, .ev a.url:hover { text-decoration: underline; }
    .ev .time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>⬇️ Download Manager</h1>
    <span id="manager-badge" class="badge"><span class="dot"></span> manager</span>
    <div class="spacer"></div>
    <span id="ws-badge" class="badge"><span class="dot"></span> websocket</span>
    <a href="/">← back to app</a>
  </header>

  <div class="wrap">
    <section class="stats">
      <div class="stat"><div class="label">Queued</div><div class="value" id="stat-queued">0</div></div>
      <div class="stat"><div class="label">Downloading</div><div class="value" id="stat-active">0</div></div>
      <div class="stat"><div class="label">Completed</div><div class="value" id="stat-completed">0</div></div>
      <div class="stat"><div class="label">Failed</div><div class="value" id="stat-failed">0</div></div>
    </section>

    <section class="grid">
      <div class="col platform-spotify" id="col-spotify">
        <div class="col-head"><span class="platform-dot"></span> Spotify <span class="pill" data-pill>0 queued</span></div>
        <div class="col-body"><div data-now></div><div class="backoff" data-backoff></div><div class="queue-label">Up next</div><ul class="queue" data-queue></ul></div>
      </div>
      <div class="col platform-soundcloud" id="col-soundcloud">
        <div class="col-head"><span class="platform-dot"></span> SoundCloud <span class="pill" data-pill>0 queued</span></div>
        <div class="col-body"><div data-now></div><div class="backoff" data-backoff></div><div class="queue-label">Up next</div><ul class="queue" data-queue></ul></div>
      </div>
      <div class="col platform-youtube" id="col-youtube">
        <div class="col-head"><span class="platform-dot"></span> YouTube <span class="pill" data-pill>0 queued</span></div>
        <div class="col-body"><div data-now></div><div class="backoff" data-backoff></div><div class="queue-label">Up next</div><ul class="queue" data-queue></ul></div>
      </div>
    </section>

    <section class="events-panel">
      <div class="col">
        <div class="col-head">Live events <span class="pill" id="ev-count">0</span></div>
        <div class="col-body"><div class="feed" id="feed"></div></div>
      </div>
    </section>
  </div>

  <script>
    const PLATFORMS = ['spotify', 'soundcloud', 'youtube'];
    const feedEl = document.getElementById('feed');
    let eventCount = 0;

    /** Format an epoch-seconds (or ms) timestamp as HH:MM:SS. */
    function fmtTime(ts) {
      const ms = ts < 1e12 ? ts * 1000 : ts;
      return new Date(ms).toLocaleTimeString();
    }

    /** Map a websocket event name to a feed tag {cls, label}. */
    function tagFor(event) {
      switch (event) {
        case 'download_queued': return { cls: 'queued', label: 'queued' };
        case 'download_started': return { cls: 'started', label: 'started' };
        case 'download_completed': return { cls: 'completed', label: 'done' };
        case 'download_failed': return { cls: 'failed', label: 'failed' };
        case 'song_redownloaded': return { cls: 'completed', label: 're-dl' };
        case 'sync_item_updated': return { cls: 'sync', label: 'sync' };
        default: return { cls: 'queued', label: event };
      }
    }

    /** Build a human description string for an event payload. */
    function describe(event, data) {
      if (event === 'song_redownloaded') return `song #${data.song_id} replaced`;
      if (event === 'sync_item_updated') return `playlist #${data.playlist_id} → ${data.status}`;
      const title = data.title || data.url || 'Unknown';
      const artist = data.artist ? ` — ${data.artist}` : '';
      return `${title}${artist}`;
    }

    /** Prepend an event row to the live feed. */
    function addEvent(event, data, ts) {
      const { cls, label } = tagFor(event);
      const row = document.createElement('div');
      row.className = 'ev';
      const reason = (event === 'download_failed' && data.failure_reason)
        ? `<span class="reason reason-${escapeHtml(data.failure_reason)}">${escapeHtml(data.failure_reason).replace('_', ' ')}</span>`
        : '';
      const src = data.source ? `<span class="src"> · ${data.source}</span>` : '';
      // Stored location: completed downloads carry `path`; re-downloads carry the new audio `url`.
      const path = data.path || (event === 'song_redownloaded' ? data.url : null);
      const pathLine = path ? `<code class="path">${escapeHtml(path)}</code>` : '';
      // Source link we're downloading from (not for re-downloads, whose `url` is the local audio path).
      const srcUrl = event === 'song_redownloaded' ? null : (data.url || data.download_link);
      const urlLine = srcUrl
        ? `<a class="url" href="${escapeHtml(srcUrl)}" target="_blank" rel="noopener" title="${escapeHtml(srcUrl)}">${escapeHtml(srcUrl)}</a>`
        : '';
      row.innerHTML = `
        <span class="tag ${cls}">${label}</span>
        <span class="desc"><span class="line">${escapeHtml(describe(event, data))}${src}${reason}</span>${urlLine}${pathLine}</span>
        <span class="time">${fmtTime(ts || Date.now())}</span>`;
      feedEl.prepend(row);
      while (feedEl.childElementCount > 200) feedEl.lastElementChild.remove();
      eventCount++;
      document.getElementById('ev-count').textContent = eventCount;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    /** Render the "now downloading" card for a platform column. */
    function renderNow(col, track) {
      const el = col.querySelector('[data-now]');
      if (!track) {
        el.innerHTML = `<div class="now idle">idle</div>`;
        return;
      }
      const url = track.url
        ? `<a class="src-url" href="${escapeHtml(track.url)}" target="_blank" rel="noopener" title="${escapeHtml(track.url)}">${escapeHtml(track.url)}</a>`
        : '';
      el.innerHTML = `
        <div class="now">
          <div class="title">${escapeHtml(track.title || 'Unknown')}</div>
          <div class="artist">${escapeHtml(track.artist || '')}</div>
          ${url}
          <div class="progress"><i></i></div>
        </div>`;
    }

    /** Render the pending queue list for a platform column. */
    function renderQueue(col, items) {
      const ul = col.querySelector('[data-queue]');
      if (!items || !items.length) {
        ul.innerHTML = `<li class="empty">Nothing queued</li>`;
        return;
      }
      ul.innerHTML = items.map((t, i) => {
        const url = t.url
          ? `<a class="src-url" href="${escapeHtml(t.url)}" target="_blank" rel="noopener" title="${escapeHtml(t.url)}">${escapeHtml(t.url)}</a>`
          : '';
        return `
        <li>
          <span class="num">${i + 1}</span>
          <span class="t"><span class="line"><b>${escapeHtml(t.title || 'Unknown')}</b> <span>${escapeHtml(t.artist || '')}</span></span>${url}</span>
        </li>`;
      }).join('');
    }

    /** Render the exponential-backoff state for a platform column. */
    function renderBackoff(col, info) {
      const el = col.querySelector('[data-backoff]');
      const fails = info ? (info.consecutive_failures || 0) : 0;
      const delay = info ? (info.next_delay || 0) : 0;
      el.className = 'backoff' + (fails > 0 ? ' warn' : '');
      el.innerHTML = `
        <div class="chip fails"><span class="k">Consec. failures</span><span class="v">${fails}</span></div>
        <div class="chip"><span class="k">Next delay</span><span class="v">${delay.toFixed(1)}s</span></div>`;
    }

    /** Apply a full status snapshot from /api/download/status. */
    function applyStatus(status) {
      // Manager badge
      const mBadge = document.getElementById('manager-badge');
      mBadge.querySelector('.dot').className = 'dot ' + (status.active ? 'on' : 'off');
      mBadge.lastChild.textContent = status.active ? ' manager running' : ' manager stopped';

      let totalQueued = 0, totalActive = 0;
      for (const p of PLATFORMS) {
        const col = document.getElementById('col-' + p);
        const queued = status.queues[p] || [];
        const current = status.current[p];
        totalQueued += queued.length;
        if (current) totalActive++;
        col.querySelector('[data-pill]').textContent = `${queued.length} queued`;
        renderNow(col, current);
        renderBackoff(col, (status.backoff || {})[p]);
        renderQueue(col, queued);
      }

      document.getElementById('stat-queued').textContent = totalQueued;
      document.getElementById('stat-active').textContent = totalActive;
      document.getElementById('stat-completed').textContent = status.stats.completed;
      document.getElementById('stat-failed').textContent = status.stats.failed;
    }

    async function refreshStatus() {
      try {
        const res = await fetch('/api/download/status');
        if (res.ok) applyStatus(await res.json());
      } catch (e) { /* transient; next poll retries */ }
    }

    // --- Live WebSocket feed ---
    const socket = io();
    const wsBadge = document.getElementById('ws-badge');
    socket.on('connect', () => {
      wsBadge.querySelector('.dot').className = 'dot on';
      wsBadge.lastChild.textContent = ' websocket connected';
    });
    socket.on('disconnect', () => {
      wsBadge.querySelector('.dot').className = 'dot off';
      wsBadge.lastChild.textContent = ' websocket disconnected';
    });

    const LIVE_EVENTS = [
      'download_queued', 'download_started', 'download_completed',
      'download_failed', 'song_redownloaded', 'sync_item_updated'
    ];
    LIVE_EVENTS.forEach(ev => socket.on(ev, data => {
      addEvent(ev, data);
      refreshStatus(); // queue/active changed — pull a fresh snapshot
    }));

    // --- Initial load: snapshot + recent event history, then poll ---
    (async function init() {
      try {
        const res = await fetch('/api/download/status');
        if (res.ok) {
          const status = await res.json();
          applyStatus(status);
          (status.recent_events || []).forEach(e => addEvent(e.event, e.data, e.ts));
        }
      } catch (e) { /* ignore */ }
      setInterval(refreshStatus, 1500);
    })();
  </script>
</body>
</html>
