# SyncMusic4 behind nginx on the Hetzner box that already terminates TLS for
# adun.ai (see also the f26.adun.ai site next to this one).
#
# Why this exists: the app speaks plain HTTP on :8008. Safari tries https://
# first, waitress answers a TLS ClientHello with silence rather than a reset,
# and the browser waits out its own upgrade timeout before retrying in the
# clear. Real TLS in front removes that stall, and a service worker only
# registers in a secure context, so static/sw.js (PWA install, offline shell,
# iOS background playback) only works on https.
#
# This file is deliberately HTTP-only. Do not add ssl_certificate lines by
# hand: nginx refuses to start if they point at a cert that does not exist
# yet, and certbot needs nginx running to answer the ACME challenge.
# `certbot --nginx` rewrites this file in place — moving the location blocks
# into a 443 server and leaving a redirect on 80. After that it is certbot's.
#
# Install (on the server, as root):
#   1. DNS first: an A record  sm4.adun.ai -> <server-ip>
#      Confirm before going on: `dig +short sm4.adun.ai`
#   2. cp ~/syncmusic4/deploy/nginx-sm4.conf /etc/nginx/sites-available/sm4
#      ln -sf /etc/nginx/sites-available/sm4 /etc/nginx/sites-enabled/sm4
#      nginx -t && systemctl reload nginx
#   3. certbot --nginx -d sm4.adun.ai
#      -> https://sm4.adun.ai, with http:// redirecting to it.

server {
    listen 80;
    listen [::]:80;
    server_name sm4.adun.ai;

    # The app does not compress anything itself, so nginx does it. Audio is
    # already compressed and is excluded by gzip_types anyway.
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Playlist-icon uploads (/api/playlists/<id>/icon) are straight off a phone
    # camera; the 1m default rejects them as 413.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/search shells out to yt-dlp with a 60s timeout of its own, and
        # the sync endpoints can sit even longer; the 60s nginx default would
        # turn those into a 504 before the app ever answers.
        proxy_read_timeout 300s;
    }

    # Audio streams are large and seeked with Range requests. Buffering would
    # make nginx spool each file through a temp file before the first byte
    # reaches the player, which shows up as a stall on every skip.
    location /audio/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Socket.IO runs with allow_upgrades=False (waitress cannot hand engine.io
    # the raw socket a WebSocket upgrade needs), so every client parks a long
    # polling GET here until the server pushes a download-status event.
    # Buffering would sit on the payload and the default read timeout would cut
    # the poll short. No Upgrade/Connection headers here on purpose: passing a
    # hardcoded "Connection: upgrade" upstream on ordinary polling requests
    # confuses waitress, and there is no WebSocket to forward anyway.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
